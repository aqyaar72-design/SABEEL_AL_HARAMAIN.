<!DOCTYPE html><html lang="so"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gelitaanka Maamulka | Sabeel Al-Haramain</title><link rel="stylesheet" href="css/style.css"></head><body><section class="section" style="min-height:100vh;display:flex;align-items:center"><div class="container" style="max-width:520px"><div class="form-card large"><div style="text-align:center"><img src="images/logo.png" style="width:90px;height:90px;object-fit:contain"><p class="eyebrow">SABEEL AL-HARAMAIN</p><h2>Gelitaanka Maamulka</h2></div><form id="loginForm"><label>Iimayl<input id="email" type="email" required></label><label>Furaha Sirta<input id="password" type="password" required></label><button class="btn primary" type="submit">Soo Gal</button><p class="form-note" id="loginMsg"></p></form></div></div></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script>loginForm.addEventListener("submit",async e=>{e.preventDefault();loginMsg.textContent="Waa la hubinayaa...";const {data,error}=await supabaseClient.auth.signInWithPassword({email:email.value,password:password.value});if(error){loginMsg.textContent="Iimayl ama furaha sirta ayaa khaldan.";return}const {data:admin}=await supabaseClient.from("admins").select("id").eq("user_id",data.user.id).maybeSingle();if(!admin){await supabaseClient.auth.signOut();loginMsg.textContent="Akoonkan ma aha maamule.";return}location.href="admin-dashboard.html"});</script></body></html>
