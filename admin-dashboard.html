<!DOCTYPE html><html lang="so"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maamulka | Sabeel Al-Haramain</title><link rel="stylesheet" href="css/style.css"><style>.dashboard{padding:30px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:20px 0}.stat{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px}.stat strong{display:block;font-size:30px}.table-wrap{overflow:auto;background:#fff;border-radius:12px}.booking-table{width:100%;min-width:900px;border-collapse:collapse}.booking-table th,.booking-table td{padding:11px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.booking-table th{background:#f3f6f4}.action{border:0;border-radius:6px;padding:7px;margin:2px;cursor:pointer}.confirm{background:#dff5e7}.cancel{background:#fde8e7}.delete{background:#222;color:#fff}.logout{float:right;padding:9px;border:0;border-radius:7px;cursor:pointer}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><header class="header"><div class="container nav"><a class="brand" href="index.html"><img src="images/logo.png"><span>SABEEL AL-HARAMAIN</span></a><button class="logout" id="logout">Ka Bax</button></div></header><main class="dashboard"><div class="container"><p class="eyebrow">MAAMULKA</p><h1>Dashboard-ka Ballamaha</h1><div class="stats"><div class="stat">Dhammaan<strong id="total">0</strong></div><div class="stat">Cusub<strong id="fresh">0</strong></div><div class="stat">La xaqiijiyey<strong id="confirmed">0</strong></div><div class="stat">Tirada dadka<strong id="people">0</strong></div></div><div class="table-wrap"><table class="booking-table"><thead><tr><th>Ballan</th><th>Magac</th><th>Telefoon</th><th>Adeeg</th><th>Tirada</th><th>Taariikh</th><th>Xaalad</th><th>Ficil</th></tr></thead><tbody id="rows"><tr><td colspan="8">Waa la soo gelinayaa...</td></tr></tbody></table></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script>const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));async function start(){const {data:{user}}=await supabaseClient.auth.getUser();if(!user){location.href="admin-login.html";return}const {data:a}=await supabaseClient.from("admins").select("id").eq("user_id",user.id).maybeSingle();if(!a){await supabaseClient.auth.signOut();location.href="admin-login.html";return}load()}async function load(){const {data,error}=await supabaseClient.from("bookings").select("*").order("created_at",{ascending:false});if(error){rows.innerHTML="<tr><td colspan=8>Waxbaa khaldamay marka xogta la soo qaadayo.</td></tr>";return}total.textContent=data.length;fresh.textContent=data.filter(x=>x.status==="Cusub").length;confirmed.textContent=data.filter(x=>x.status==="La xaqiijiyey").length;people.textContent=data.reduce((n,x)=>n+(x.pilgrims||0),0);if(!data.length){rows.innerHTML="<tr><td colspan=8>Weli booking lama helin.</td></tr>";return}rows.innerHTML=data.map(b=>`<tr><td><b>${esc(b.booking_id)}</b></td><td>${esc(b.full_name)}</td><td>${esc(b.phone)}</td><td>${esc(b.service_name)}</td><td>${b.pilgrims||1}</td><td>${esc(b.travel_date||"-")}</td><td>${esc(b.status)}</td><td><button class="action confirm" onclick="status(${b.id},'La xaqiijiyey')">Xaqiiji</button><button class="action cancel" onclick="status(${b.id},'La joojiyey')">Jooji</button><button class="action delete" onclick="removeB(${b.id})">Tirtir</button></td></tr>`).join("")}async function status(id,s){const {error}=await supabaseClient.from("bookings").update({status:s}).eq("id",id);if(error)alert("Lama cusboonaysiin.");else load()}async function removeB(id){if(!confirm("Ma hubtaa?"))return;const {error}=await supabaseClient.from("bookings").delete().eq("id",id);if(error)alert("Lama tirtiri karin.");else load()}logout.onclick=async()=>{await supabaseClient.auth.signOut();location.href="admin-login.html"};start();</script></body></html>
